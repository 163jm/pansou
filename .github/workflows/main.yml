name: 编译发布二进制

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号（如 v1.2.0），不填则用 dev'
        required: false
        default: 'dev'

jobs:
  # ──────────────────────────────────────────────
  # 编译矩阵：一次 job 跑多个平台
  # ──────────────────────────────────────────────
  build:
    name: 编译 ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 某个平台失败不影响其他平台
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''          # Linux 二进制无后缀
          - goos: linux
            goarch: arm64
            suffix: ''
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # 从 go.mod 读取版本，自动安装
          cache: true

      - name: 获取版本号
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-dev}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "构建版本: ${VERSION}"

      - name: 编译
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          BINARY="pansou-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"

          go build \
            -trimpath \
            -ldflags="-s -w \
              -X 'main.version=${VERSION}' \
              -X 'main.buildDate=${BUILD_DATE}' \
              -X 'main.gitCommit=${{ github.sha }}'" \
            -o "${BINARY}" \
            .

          echo "BINARY=${BINARY}" >> "$GITHUB_ENV"
          ls -lh "${BINARY}"

      - name: 打包成 tar.gz（Linux / macOS）
        if: matrix.goos != 'windows'
        run: |
          ARCHIVE="${BINARY%.exe}.tar.gz"          # 去掉 .exe 再加后缀（非 Win 无 .exe）
          ARCHIVE="pansou-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "${ARCHIVE}" "${BINARY}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          ls -lh "${ARCHIVE}"

      - name: 打包成 zip（Windows）
        if: matrix.goos == 'windows'
        run: |
          ARCHIVE="pansou-windows-amd64.zip"
          zip "${ARCHIVE}" "${BINARY}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          ls -lh "${ARCHIVE}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pansou-${{ matrix.goos }}-${{ matrix.goarch }}
          # 同时保留裸二进制和压缩包，方便 release job 统一收集
          path: |
            pansou-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
            pansou-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            pansou-windows-amd64.zip
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # 创建 GitHub Release（仅 tag 触发时执行）
  # ──────────────────────────────────────────────
  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write     # 必须有写权限才能创建 release

    steps:
      - name: 检出代码（用于读取 changelog）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 拉取完整历史，generate_release_notes 需要

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true    # 把所有 artifact 合并到同一目录

      - name: 列出待发布文件
        run: ls -lh dist/

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ github.ref_name }}
          name:                   PanSou ${{ github.ref_name }}
          generate_release_notes: true   # 自动从 commit 生成 changelog
          draft:                  false
          prerelease:             ${{ contains(github.ref_name, '-') }}  # 含 - 的 tag 视为预发布（如 v1.0.0-beta）
          files: |
            dist/*.tar.gz
            dist/*.zip
